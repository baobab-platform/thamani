# One-time format-only reconciliation. The source branch's approved
# Prettier version formats only three audited BGX-03 files; this workflow
# removes itself in the resulting commit. Normal quality CI remains required.
name: BGX-03 format guarded admission sources
on:
  push:
    branches: [feat/bgx03-shipment-evidence-admission-prep]
    paths: [.github/workflows/bgx03-prettier-bootstrap.yml]
permissions:
  contents: write
  packages: read
jobs:
  format:
    if: ${{ github.repository == 'baobab-platform/thamani' && github.ref == 'refs/heads/feat/bgx03-shipment-evidence-admission-prep' }}
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout audited BGX-03 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Pin pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@baobab-platform'
      - name: Format exact BGX-03 files and remove one-time workflow
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm exec prettier --write \
            src/lib/logistics/bgx03-admission.ts \
            src/lib/logistics/bgx03-admission.test.ts \
            docs/frontend/bgx03-04-qualification.md
          pnpm exec prettier --check \
            src/lib/logistics/bgx03-admission.ts \
            src/lib/logistics/bgx03-admission.test.ts \
            docs/frontend/bgx03-04-qualification.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            src/lib/logistics/bgx03-admission.ts \
            src/lib/logistics/bgx03-admission.test.ts \
            docs/frontend/bgx03-04-qualification.md
          git rm -- .github/workflows/bgx03-prettier-bootstrap.yml
          git commit -m "style(bgx03): apply repository-pinned formatting to admission preflight"
          git push origin HEAD:refs/heads/feat/bgx03-shipment-evidence-admission-prep
