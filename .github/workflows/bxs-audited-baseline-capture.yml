# Temporary, branch-restricted acceptance-evidence transfer. This workflow
# self-deletes in the same commit as the two reviewed screenshot baselines.
# It does not regenerate screenshots, execute artifact content or relax CI.
name: Transfer reviewed Thamani visual baselines
on:
  push:
    branches: [test/bxs-logistics-visual-acceptance]
    paths: [.github/workflows/bxs-audited-baseline-capture.yml]
permissions:
  contents: write
  actions: read
jobs:
  transfer:
    if: ${{ github.repository == 'baobab-platform/thamani' && github.ref == 'refs/heads/test/bxs-logistics-visual-acceptance' }}
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout branch for reviewed artifact transfer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Verify immutable browser evidence and commit golden references
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          temp="$(mktemp -d)"
          trap 'rm -rf "$temp"' EXIT
          gh run download 39050814176 --repo baobab-platform/thamani --name thamani-logistics-browser --dir "$temp"
          root="tests/browser/logistics.spec.ts-snapshots"
          mkdir -p "$root"
          for viewport in desktop mobile; do
            file="logistics-workspace-${viewport}-linux.png"
            test -s "$temp/$root/$file"
            cp "$temp/$root/$file" "$root/$file"
          done
          echo "feb93480c543dd8cc50679ae096f870c62fc574b695cfde9a06e1e92ea4534b7  $root/logistics-workspace-desktop-linux.png" | sha256sum -c -
          echo "5381e8b0ccc20a60562d83cd865a98e08ff856d82db315512f08aca32e5959a3  $root/logistics-workspace-mobile-linux.png" | sha256sum -c -
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$root/logistics-workspace-desktop-linux.png" "$root/logistics-workspace-mobile-linux.png"
          git rm -- .github/workflows/bxs-audited-baseline-capture.yml
          git commit -m "test(bxs): commit reviewed desktop and mobile logistics snapshots"
          git push origin HEAD:refs/heads/test/bxs-logistics-visual-acceptance
