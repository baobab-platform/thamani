name: BXS-05G Formatting Receipt
on:
  push:
    branches:
      - feat/bxs-05g-thamani-shipment-workspace
permissions:
  contents: read
  packages: read
jobs:
  formatting:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: https://npm.pkg.github.com
          scope: '@baobab-platform'
      - name: Resolve exact formatting changes
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm exec prettier --write src/components/logistics/shipment-workspace.tsx src/components/logistics/shipment-workspace.test.tsx
          echo BXS_FORMAT_BEGIN
          git diff -- src/components/logistics/shipment-workspace.tsx src/components/logistics/shipment-workspace.test.tsx
          echo BXS_FORMAT_END
