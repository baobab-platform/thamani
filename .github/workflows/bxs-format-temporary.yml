# Temporary one-branch formatter; removed after its source-only commit.
name: BXS source formatter (temporary)
on:
  push:
    branches: [feat/bxs-six-package-logistics-quality-gates-20261102]
permissions:
  contents: write
  packages: read
jobs:
  format:
    if: github.repository == 'baobab-platform/thamani'
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/baobab-platform/baobab-dev:1.4.4-frontend@sha256:1b3165067912eacbca96b576efb67e0428850b1ff1a953aa9013127a01635371
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure read-only private packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_HEAD_REPO: ${{ github.repository }}
        run: bash scripts/configure-private-npm.sh
      - run: pnpm install --frozen-lockfile
      - name: Apply exact repository Prettier formatting
        run: pnpm format
      - name: Commit only source formatting to this feature branch
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/frontend/bxs-six-package-logistics-quality.md             e2e/landing-page.accessibility.spec.ts             e2e/lighthouse.spec.ts             scripts/check-performance-budget.mjs             scripts/verify-bxs-six.node.mjs             src/lib/presentation/logistics-bxs.ts             src/lib/presentation/logistics-bxs.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(bxs): apply repository Prettier formatting"
            git push origin HEAD:refs/heads/feat/bxs-six-package-logistics-quality-gates-20261102
          fi
