# Temporary branch-restricted acquisition of CI-generated screenshots for
# human review. It does NOT update golden references or bypass browser gates.
name: Inspect BXS 0.3.1 logistics image diff
on:
  push:
    branches: [feat/bxs-published-experience-upgrade-20261018]
    paths: [.github/workflows/bxs-visual-review-capture.yml]
permissions:
  contents: write
  actions: read
jobs:
  review:
    if: ${{ github.repository == 'baobab-platform/thamani' && github.ref == 'refs/heads/feat/bxs-published-experience-upgrade-20261018' }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: true }
      - name: Transfer generated screenshots for comparison, not approval
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          temp="$(mktemp -d)"
          trap 'rm -rf "$temp"' EXIT
          gh run download 39074064239 --repo baobab-platform/thamani --name thamani-logistics-browser --dir "$temp"
          mkdir -p .bxs-review
          for viewport in desktop mobile; do
            file="$(find "$temp/test-results" -type f -name 'logistics-workspace-actual.png' -path "*viewport-visuals-${viewport}/*" -print -quit)"
            test -n "$file"
            test -s "$file"
            cp "$file" ".bxs-review/logistics-${viewport}-actual.png"
            sha256sum ".bxs-review/logistics-${viewport}-actual.png"
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .bxs-review/
          git rm -- .github/workflows/bxs-visual-review-capture.yml
          git commit -m 'test(bxs): stage generated screenshots for human diff review, not golden approval'
          git push origin HEAD:refs/heads/feat/bxs-published-experience-upgrade-20261018
