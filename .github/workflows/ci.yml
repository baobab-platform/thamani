name: CI
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
permissions: { contents: read, packages: read }
concurrency: { group: "ci-${{ github.workflow }}-${{ github.ref }}", cancel-in-progress: true }
jobs:
  verify:
    runs-on: ubuntu-26.04
    container:
      {
        image: "ghcr.io/baobab-platform/baobab-dev:1.4.4-frontend@sha256:1b3165067912eacbca96b576efb67e0428850b1ff1a953aa9013127a01635371",
        credentials: { username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" },
        options: "--user 0",
      }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Audit legacy Medusa Store consumers against ADR-THA-0018 (static only)
        run: node scripts/verify-medusa-2212-legacy.mjs
      - name: Configure trusted GitHub Packages credentials
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: bash scripts/configure-private-npm.sh
      - run: pnpm install --frozen-lockfile
      - name: Verify Foundation v2 configuration coherence
        run: node --test scripts/verify-foundation-v2.node.mjs
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          MEDUSA_BACKEND_URL: http://localhost:9000
          NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: pk_ci_build_only
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          NEXT_PUBLIC_MARKET: za
          NEXT_PUBLIC_DEFAULT_REGION_ID: reg_ci_build_only
      - name: Build isolated synthetic logistics prototype
        run: pnpm prototype:build
      - run: test -f contracts.lock.yaml && test -f runtime/requirements.yaml && test -f .baobab/environment.yaml
  image:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build with read-only npm registry secret
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          bash scripts/configure-private-npm.sh
          docker build --secret id=npm_token,env=NODE_AUTH_TOKEN --build-arg MEDUSA_BACKEND_URL=http://localhost:9000 --build-arg NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY=pk_ci --build-arg NEXT_PUBLIC_SITE_URL=http://localhost:3000 --build-arg NEXT_PUBLIC_DEFAULT_REGION_ID=reg_ci --tag thamani:test .

  logistics-browser:
    name: Logistics browser keyboard and accessibility
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    container:
      {
        image: "ghcr.io/baobab-platform/baobab-dev:1.4.4-frontend-e2e@sha256:eb9c401cea16c4f333c28b250dd455e505752dfc6d11e9779a182a02bc207213",
        credentials: { username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" },
        options: "--user 0",
      }
    env:
      PLAYWRIGHT_BROWSERS_PATH: /root/.cache/ms-playwright
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure trusted GitHub Packages credentials
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: bash scripts/configure-private-npm.sh
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:logistics:browser
      - name: Verify landing and Next.js logistics routes
        run: pnpm test:e2e
        env:
          MEDUSA_BACKEND_URL: http://localhost:9000
          NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: pk_ci_build_only
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          NEXT_PUBLIC_MARKET: za
          NEXT_PUBLIC_DEFAULT_REGION_ID: reg_ci_build_only
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.7.5
        with:
          name: thamani-logistics-browser
          if-no-files-found: error
          path: |
            playwright-report/
            test-results/
            tests/browser/logistics.spec.ts-snapshots/
