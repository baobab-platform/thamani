name: CI
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
permissions: { contents: read, packages: read }
concurrency: { group: "ci-${{ github.workflow }}-${{ github.ref }}", cancel-in-progress: true }
jobs:
  verify:
    runs-on: ubuntu-26.04
    container:
      {
        image: "ghcr.io/baobab-platform/baobab-dev:1.4.4-frontend@sha256:1b3165067912eacbca96b576efb67e0428850b1ff1a953aa9013127a01635371",
        credentials: { username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" },
        options: "--user 0",
      }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Audit legacy Medusa Store consumers against ADR-THA-0018 (static only)
        run: node scripts/verify-medusa-2212-legacy.mjs
      - name: Configure trusted GitHub Packages credentials
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: bash scripts/configure-private-npm.sh
      - name: Generate exact offline-compatible lock candidate (diagnostic; source gate retained)
        run: |
          set -euo pipefail
          pnpm install --lockfile-only --no-frozen-lockfile
          base64 -w0 pnpm-lock.yaml | fold -w 4000 | sed 's/^/THAMANI_LOCK_B64 /'
          echo "::error::Reconciled dependency lock must be committed to PR before source acceptance"
          exit 1
      - run: pnpm install --frozen-lockfile
      - name: Verify Foundation v2 configuration coherence
        run: node --test scripts/verify-foundation-v2.node.mjs
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm bxs:verify
      - run: pnpm build
        env:
          MEDUSA_BACKEND_URL: http://localhost:9000
          NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: pk_ci_build_only
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          NEXT_PUBLIC_MARKET: za
          NEXT_PUBLIC_DEFAULT_REGION_ID: reg_ci_build_only
      - name: Build isolated synthetic logistics prototype
        run: pnpm prototype:build
      - run: test -f contracts.lock.yaml && test -f runtime/requirements.yaml && test -f .baobab/environment.yaml
  image:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Build with read-only npm registry secret
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          bash scripts/configure-private-npm.sh
          docker build --secret id=npm_token,env=NODE_AUTH_TOKEN --build-arg MEDUSA_BACKEND_URL=http://localhost:9000 --build-arg NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY=pk_ci --build-arg NEXT_PUBLIC_SITE_URL=http://localhost:3000 --build-arg NEXT_PUBLIC_DEFAULT_REGION_ID=reg_ci --tag thamani:test .

  logistics-browser:
    name: Logistics browser keyboard and accessibility
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    container:
      {
        image: "ghcr.io/baobab-platform/baobab-dev:1.4.4-frontend-e2e@sha256:eb9c401cea16c4f333c28b250dd455e505752dfc6d11e9779a182a02bc207213",
        credentials: { username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" },
        options: "--user 0",
      }
    env:
      PLAYWRIGHT_BROWSERS_PATH: /root/.cache/ms-playwright
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact owner source SHA
        env:
          DEV11_EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -eu
          # Bind original reports to the candidate, not GitHub's temporary merge.
          # Checkout uses a temporary HOME; trust only this job-owned workspace.
          task_source_sha="$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD)"
          test "$task_source_sha" = "$DEV11_EXPECTED_SOURCE_SHA"
          mkdir -p reports
          printf '%s\n' "$task_source_sha" > reports/dev11-source-sha.txt
      - name: Configure trusted GitHub Packages credentials
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: bash scripts/configure-private-npm.sh
      - run: pnpm install --frozen-lockfile
      # The baobab-dev browser image predates the upgrade to Playwright 1.65;
      # download the exact browser revisions required by this lockfile instead
      # of weakening the browser/visual/accessibility checks or retrying old binaries.
      - name: Install Playwright browsers matching the exact pnpm lock
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Preserve original gate reports during later diagnostics
        run: node scripts/dev11-report-custody.node.mjs
      - name: Logistics keyboard and browser journeys
        env:
          CI: "true"
        run: pnpm test:logistics:browser
      - name: Build production estate for independent quality gates
        env:
          MEDUSA_BACKEND_URL: http://localhost:9000
          NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: pk_ci_build_only
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_MARKET: za
          NEXT_PUBLIC_DEFAULT_REGION_ID: reg_ci_build_only
        run: pnpm build
      - name: Enforce emitted-asset performance budget
        run: pnpm perf:budget
      - name: Regression-test DEV-11 budget failure evidence and strict thresholds
        run: node --test scripts/check-performance-budget.node.mjs
      - name: Verify landing and Next.js logistics routes
        run: pnpm test:e2e
        env:
          CI: "true"
          DEV11_EVIDENCE_GATE: functional
          MEDUSA_BACKEND_URL: http://localhost:9000
          NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: pk_ci_build_only
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          NEXT_PUBLIC_MARKET: za
          NEXT_PUBLIC_DEFAULT_REGION_ID: reg_ci_build_only
      - name: Independent homepage visual layout and screenshot evidence
        run: pnpm test:e2e:visual
        env:
          CI: "true"
          DEV11_EVIDENCE_GATE: visual
      - name: WCAG landing-page and logistics-route accessibility
        run: pnpm test:e2e:a11y
        env:
          CI: "true"
          DEV11_EVIDENCE_GATE: accessibility
      - name: Isolated Lighthouse production-build lab
        run: pnpm test:e2e:lighthouse
        env:
          CI: "true"
          DEV11_EVIDENCE_GATE: lighthouse
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: thamani-logistics-browser
          if-no-files-found: error
          path: |
            playwright-report/
            test-results/
            tests/browser/logistics.spec.ts-snapshots/
            !test-results/**/*.tmp
            reports/dev11-*-playwright.json
            reports/dev11-source-sha.txt
            reports/static-budget.json
