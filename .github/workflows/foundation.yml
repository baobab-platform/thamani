name: Foundation Repository Gates

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  actions: read
  security-events: write

jobs:
  foundation:
    uses: baobab-platform/shared/.github/workflows/foundation-repository-gates.yml@1517429bcae601a1b0288ca0279e524ce48a3d77 # BXS-05 trusted registry Foundation
    with:
      foundation_ref: "756892fbdbcf0eb89bf62f720c372bad53748dea"
      profile: full
      dockerfile: "Dockerfile"
      build_context: "."
      dependency_review_enabled: true
