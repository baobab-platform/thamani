name: Foundation Repository Gates

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  actions: read
  security-events: write

jobs:
  foundation:
    uses: baobab-platform/shared/.github/workflows/foundation-repository-gates.yml@4ea2cbb5638a5605e057a02665bc7360864fc253 # BXS-05 trusted registry Foundation
    with:
      foundation_ref: "4ea2cbb5638a5605e057a02665bc7360864fc253"
      profile: full
      dockerfile: "Dockerfile"
      build_context: "."
      dependency_review_enabled: true
