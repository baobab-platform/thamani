name: Security
on:
  push: { branches: [main] }
  pull_request:
  schedule: [{ cron: "0 4 * * 1" }]
  workflow_dispatch:
permissions: { contents: read, packages: read }
jobs:
  codeql:
    permissions: { contents: read, security-events: write, actions: read }
    uses: baobab-platform/shared/.github/workflows/security-codeql.yml@5d8445c858bcbfa538959dd5804c4c87e0bf906e
    with: { languages: '["javascript-typescript"]' }
  dependency-audit:
    runs-on: ubuntu-26.04
    container: { image: "ghcr.io/baobab-platform/baobab-dev:1.4.4-frontend", options: "--user 0" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
