name: Security
on:
  push: { branches: [main] }
  pull_request:
  schedule: [{ cron: "0 4 * * *" }]
  workflow_dispatch:
permissions: { contents: read, packages: read }
jobs:
  codeql:
    permissions: { contents: read, security-events: write, actions: read }
    uses: baobab-platform/shared/.github/workflows/security-codeql.yml@756892fbdbcf0eb89bf62f720c372bad53748dea # accepted private-registry Foundation
    with: { languages: '["javascript-typescript"]' }
  dependency-audit:
    runs-on: ubuntu-26.04
    container: { image: "ghcr.io/baobab-platform/baobab-dev:1.4.4-frontend@sha256:1b3165067912eacbca96b576efb67e0428850b1ff1a953aa9013127a01635371", options: "--user 0" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure trusted GitHub Packages credentials
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: bash scripts/configure-private-npm.sh
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
