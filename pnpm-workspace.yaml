packages: []
# Patched transitive leaves (pnpm audit --audit-level high):
#   sharp                CVE-2026-96889      GHSA-wq5f-xc86-pv6w
#   source-map-js        >=1.2.2             GHSA-68fv-2mgg-jv7q
#   brace-expansion      1.x >=1.1.21, 5.x >=5.0.12 (DoS via uncontrolled recursion)
#   undici               >=8.12.2            GHSA-xjj6-f33q-929c (DoS)
#   zod                  >=4.6.6             GHSA-mrhx-c7xc-m3w5 (memory exhaustion)
overrides:
  sharp: 0.35.5
  source-map-js: 1.2.2
  "brace-expansion@<1.1.21": 1.1.21
  "brace-expansion@>=4.0.0 <5.0.12": 5.0.12
  "undici@>=8.0.0 <8.12.2": 8.12.2
  "zod@>=4.0.0 <4.6.6": 4.6.6
# braces <=3.0.3 (GHSA-vfj7-8cjw-p6xm, stack exhaustion via deeply nested patterns) has NO patched
# release: 3.0.3 is the latest. It is reachable only as a development dependency
# (eslint-config-next > @next/eslint-plugin-next > fast-glob > micromatch > braces), processes
# patterns from this repository's own lint configuration, and is absent from the production image
# (the runtime stage copies only .next/standalone). The former repository-wide advisory
# suppression has been removed under BA-SEC-DEP-001. Verify the current advisory
# state and real lockfile path; if still relevant, request a narrow, expiring
# independently approved exception rather than silently suppressing the whole audit.
# BA-SEC-DEP-001: no unbounded auditConfig.ignoreGhsas suppression.
# Upstream advisories (including GHSA-vfj7-8cjw-p6xm) must be reported,
# patched or handled via the existing independently approved, expiring
# Foundation exception governance. Never silently call an ignored advisory clean.
allowBuilds:
  esbuild: true
  unrs-resolver: true

# Immutable, publisher-verified Experience registry releases only.
# Fixed-version exceptions are allowed only after independently verified
# GitHub Packages SHA512/export run 39073362603 (2026-10-17).
minimumReleaseAgeExclude:
  - "@baobab-platform/experience-geo-core@0.3.1"
  - "@baobab-platform/experience-tokens@0.3.1"
  - "@baobab-platform/experience-ui@0.3.1"
