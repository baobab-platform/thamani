schema: { name: "baobab-digital-estate-runtime-requirements", version: "1.0" }
application:
  { name: "thamani", entity_id: "THAMANI-GLOBAL", kind: "digital-estate", container_port: 3000 }
ownership:
  {
    application: "baobab-platform/thamani",
    commerce: "baobab-platform/baobab-trade",
    production_infrastructure: "baobab-platform/infrastructure",
  }
dependencies:
  baobab_trade: { required: true, protocol: "HTTPS", interface: "Medusa v2 Store API" }
health: { liveness_path: "/api/health" }
environment:
  public:
    [
      "NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY",
      "NEXT_PUBLIC_SITE_URL",
      "NEXT_PUBLIC_MARKET",
      "NEXT_PUBLIC_DEFAULT_REGION_ID",
    ]
  server_only: ["MEDUSA_BACKEND_URL"]
constraints:
  - "Administrative Medusa credentials are prohibited."
  - "No Baobab database may be accessed directly."
  - "Cloud resources, DNS, certificates, secret injection and production orchestration belong to baobab-platform/infrastructure."
